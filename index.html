<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mourise Studio — Screenwriting & Pre-Production Suite</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Fonts: Inter & Courier Prime -->
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-script: 'Courier Prime', 'Courier New', monospace;
    }
    body {
      font-family: var(--font-ui);
      background: radial-gradient(circle at 15% 15%, #ffffff 0%, #f1f5f9 55%, #e2e8f0 100%);
      color: #0f172a;
      overflow: hidden;
      height: 100vh;
    }

    /* White Apple Liquid Glassmorphism */
    .liquid-glass {
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(24px) saturate(190%);
      -webkit-backdrop-filter: blur(24px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.92);
      box-shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.05), inset 0 1px 0 0 rgba(255, 255, 255, 0.95);
    }
    .liquid-glass-subtle {
      background: rgba(255, 255, 255, 0.62);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.78);
    }
    .liquid-pill {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(226, 232, 240, 0.95);
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.04), inset 0 1px 0 rgba(255, 255, 255, 1);
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .liquid-pill:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(15, 23, 42, 0.07), inset 0 1px 0 rgba(255, 255, 255, 1);
    }

    /* ==========================================================
       SINGLE CONTINUOUS SCREENPLAY DOCUMENT (MENGALIR SEPERTI WORD)
       ========================================================== */
    .screenplay-sheet {
      font-family: var(--font-script);
      width: 816px;
      min-height: 1056px;
      background: #ffffff;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.07), 0 1px 3px rgba(15, 23, 42, 0.04);
      border: 1px solid rgba(226, 232, 240, 0.85);
      padding: 72px 72px 120px 96px;
      font-size: 12pt;
      line-height: 1.32;
      color: #111827;
      position: relative;
      outline: none;
      cursor: text;
      counter-reset: scene-counter;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .screenplay-sheet p {
      position: relative;
      margin: 0;
      padding: 1px 2px;
      min-height: 1.32em;
      border-radius: 2px;
    }

    /* Badge elemen aktif di margin kiri */
    .screenplay-sheet p.active-line::after {
      content: attr(data-label);
      position: absolute;
      left: -82px;
      top: 2px;
      font-family: var(--font-ui);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.05em;
      padding: 1px 5px;
      border-radius: 4px;
      background: #eff6ff;
      color: #2563eb;
      border: 1px solid #bfdbfe;
      pointer-events: none;
      user-select: none;
    }

    /* Placeholder saat baris kosong & sedang aktif */
    .screenplay-sheet p.active-line.is-empty::before {
      content: attr(data-placeholder);
      color: #cbd5e1;
      font-weight: 400;
      font-style: normal;
      pointer-events: none;
      position: absolute;
    }

    /* 1. SCENE HEADING */
    .screenplay-sheet p[data-type="scene"] {
      counter-increment: scene-counter;
      font-weight: 700;
      text-transform: uppercase;
      margin-top: 22px;
      margin-bottom: 12px;
      background: rgba(241, 245, 249, 0.45);
    }
    .screenplay-sheet p[data-type="scene"]::before {
      content: counter(scene-counter);
      position: absolute;
      left: -34px;
      top: 1px;
      font-weight: 700;
      color: #1e293b;
      pointer-events: none;
      user-select: none;
    }
    .screenplay-sheet p[data-type="scene"][data-scene-right]::after {
      content: counter(scene-counter);
      position: absolute;
      right: -34px;
      left: auto;
      top: 1px;
      font-family: var(--font-script);
      font-size: 12pt;
      font-weight: 700;
      color: #1e293b;
      background: transparent;
      border: none;
      padding: 0;
      pointer-events: none;
      user-select: none;
    }

    /* 2. ACTION */
    .screenplay-sheet p[data-type="action"] {
      margin-bottom: 12px;
    }

    /* 3. INSERT / SHOT */
    .screenplay-sheet p[data-type="insert"] {
      font-weight: 700;
      text-transform: uppercase;
      margin-top: 14px;
      margin-bottom: 12px;
    }

    /* 4. CHARACTER */
    .screenplay-sheet p[data-type="character"] {
      font-weight: 700;
      text-transform: uppercase;
      margin-top: 14px;
      margin-left: 210px;
      margin-bottom: 2px;
    }

    /* 5. PARENTHETICAL */
    .screenplay-sheet p[data-type="parenthetical"] {
      margin-left: 160px;
      margin-right: 140px;
      margin-bottom: 2px;
      font-style: italic;
    }

    /* 6. DIALOGUE */
    .screenplay-sheet p[data-type="dialogue"] {
      margin-left: 110px;
      margin-right: 120px;
      margin-bottom: 12px;
    }

    /* 7. TRANSITION */
    .screenplay-sheet p[data-type="transition"] {
      font-weight: 700;
      text-transform: uppercase;
      text-align: right;
      margin-top: 14px;
      margin-bottom: 14px;
    }

    /* Pop-up Autocomplete StudioBinder Style */
    #autocomplete-popup {
      position: fixed;
      z-index: 100;
      min-width: 270px;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(20px) saturate(190%);
      -webkit-backdrop-filter: blur(20px) saturate(190%);
      border: 1px solid rgba(203, 213, 225, 0.95);
      box-shadow: 0 14px 34px rgba(15, 23, 42, 0.14), inset 0 1px 0 #fff;
      border-radius: 12px;
      padding: 5px;
      font-family: var(--font-ui);
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.4); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(100, 116, 139, 0.6); }

    @media print {
      body { background: white; overflow: visible; height: auto; }
      .no-print { display: none !important; }
      .screenplay-sheet { box-shadow: none; border: none; margin: 0; width: 100%; }
      .screenplay-sheet p[data-type="scene"] { background: transparent; }
      .screenplay-sheet p.active-line::after { display: none !important; }
    }
  </style>
</head>
<body class="flex select-none">

  <!-- AUTOCOMPLETE POPUP (Hanya muncul untuk INT/EXT, Waktu, dan Lokasi/Karakter yang PERNAH dipakai di naskah) -->
  <div id="autocomplete-popup" class="hidden no-print">
    <div id="autocomplete-header" class="px-2.5 py-1 text-[10px] font-bold uppercase tracking-wider text-slate-400 border-b border-slate-100 flex items-center justify-between">
      <span>Saran StudioBinder</span>
      <span class="text-[9px] text-blue-600 font-semibold">Enter / Tab</span>
    </div>
    <div id="autocomplete-items" class="mt-1 max-h-56 overflow-y-auto space-y-0.5"></div>
  </div>

  <!-- LEFT NAVIGATION RAIL -->
  <aside class="no-print w-16 h-full liquid-glass flex flex-col items-center py-4 z-30 justify-between border-r border-white/80">
    <div class="flex flex-col items-center gap-5">
      <button onclick="switchView('landing')" class="w-10 h-10 rounded-2xl bg-gradient-to-br from-rose-500 to-pink-600 text-white flex items-center justify-center shadow-md shadow-rose-500/25 hover:scale-105 transition" title="Mourise Studio Home">
        <i data-lucide="clapperboard" class="w-5 h-5"></i>
      </button>

      <nav class="flex flex-col gap-3 mt-2">
        <button onclick="switchView('landing')" id="nav-home" class="flex flex-col items-center gap-1 p-2 rounded-xl text-slate-600 hover:text-slate-900 hover:bg-white/70 transition">
          <i data-lucide="home" class="w-4 h-4"></i>
          <span class="text-[10px] font-medium">Home</span>
        </button>
        <button onclick="switchView('landing')" id="nav-projects" class="flex flex-col items-center gap-1 p-2 rounded-xl text-slate-600 hover:text-slate-900 hover:bg-white/70 transition">
          <i data-lucide="folder-kanban" class="w-4 h-4"></i>
          <span class="text-[10px] font-medium">Projects</span>
        </button>
        <button onclick="switchView('editor')" id="nav-editor" class="flex flex-col items-center gap-1 p-2 rounded-xl text-blue-600 bg-white shadow-sm transition">
          <i data-lucide="file-text" class="w-4 h-4"></i>
          <span class="text-[10px] font-semibold">Script</span>
        </button>
      </nav>
    </div>

    <div class="flex flex-col items-center gap-3">
      <button onclick="exportBackupJSON()" title="Backup JSON untuk Git" class="p-2.5 rounded-xl text-slate-500 hover:text-slate-900 hover:bg-white/70 transition">
        <i data-lucide="download" class="w-4 h-4"></i>
      </button>
      <div class="text-[9px] text-slate-400 text-center leading-tight px-1">
        Mourise<br/>Studio
      </div>
    </div>
  </aside>

  <!-- MAIN CONTAINER -->
  <div class="flex-1 flex flex-col h-full overflow-hidden">

    <!-- TOP HEADER BAR -->
    <header class="no-print h-13 liquid-glass px-5 py-2.5 flex items-center justify-between border-b border-white/80 z-20">
      <div class="flex items-center gap-3">
        <div class="liquid-pill px-2.5 py-1 rounded-lg flex items-center gap-1.5 text-xs font-semibold text-blue-600 cursor-pointer" onclick="addNewRevision()">
          <span id="active-rev-badge">v1</span>
          <i data-lucide="chevron-down" class="w-3.5 h-3.5"></i>
        </div>

        <button onclick="switchView('landing')" class="liquid-pill px-3 py-1 rounded-lg flex items-center gap-2 text-xs font-semibold text-slate-800">
          <i data-lucide="briefcase" class="w-3.5 h-3.5 text-slate-600"></i>
          <span>Mourise Studio</span>
          <span
