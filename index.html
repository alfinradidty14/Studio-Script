<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mourise Studio — Screenwriting & Pre-Production Suite</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Fonts: Inter & Courier Prime (Standar Naskah Film) -->
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-script: 'Courier Prime', 'Courier New', monospace;
    }
    body {
      font-family: var(--font-ui);
      background: radial-gradient(circle at 15% 15%, #ffffff 0%, #f1f5f9 55%, #e2e8f0 100%);
      color: #0f172a;
      overflow: hidden;
      height: 100vh;
    }
    /* White Apple Liquid Glassmorphism */
    .liquid-glass {
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(24px) saturate(190%);
      -webkit-backdrop-filter: blur(24px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.05), inset 0 1px 0 0 rgba(255, 255, 255, 0.95);
    }
    .liquid-glass-subtle {
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.7);
    }
    .liquid-pill {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(226, 232, 240, 0.9);
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.04), inset 0 1px 0 rgba(255, 255, 255, 1);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .liquid-pill:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(15, 23, 42, 0.07), inset 0 1px 0 rgba(255, 255, 255, 1);
    }
    /* Kertas Skenario Standar Industri */
    .screenplay-page {
      font-family: var(--font-script);
      width: 816px;
      min-height: 1056px;
      background: #ffffff;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.07), 0 1px 3px rgba(15, 23, 42, 0.04);
      border: 1px solid rgba(226, 232, 240, 0.8);
      padding: 72px 72px 72px 96px;
      font-size: 12pt;
      line-height: 1.25;
      color: #111827;
    }
    .script-block {
      outline: none;
      position: relative;
      transition: background 0.15s ease;
      border-radius: 4px;
    }
    .script-block:focus {
      background: rgba(59, 130, 246, 0.05);
    }
    /* Format Elemen Skenario */
    .type-scene {
      font-weight: 700;
      text-transform: uppercase;
      margin-top: 24px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
    }
    .type-action {
      margin-bottom: 12px;
    }
    .type-insert {
      font-weight: 700;
      text-transform: uppercase;
      margin-top: 14px;
      margin-bottom: 10px;
    }
    .type-character {
      font-weight: 700;
      text-transform: uppercase;
      margin-top: 16px;
      margin-left: 210px;
      margin-bottom: 2px;
    }
    .type-parenthetical {
      margin-left: 160px;
      margin-bottom: 2px;
    }
    .type-dialogue {
      margin-left: 110px;
      margin-right: 120px;
      margin-bottom: 12px;
    }
    .type-transition {
      font-weight: 700;
      text-transform: uppercase;
      text-align: right;
      margin-top: 16px;
      margin-bottom: 16px;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.4); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(100, 116, 139, 0.6); }

    @media print {
      body { background: white; overflow: visible; height: auto; }
      .no-print { display: none !important; }
      .screenplay-page { box-shadow: none; border: none; margin: 0; width: 100%; }
    }
  </style>
</head>
<body class="flex select-none">

  <!-- LEFT NAVIGATION RAIL (Apple Liquid Glass) -->
  <aside class="no-print w-16 h-full liquid-glass flex flex-col items-center py-4 z-30 justify-between border-r border-white/80">
    <div class="flex flex-col items-center gap-5">
      <!-- Brand Icon -->
      <button onclick="switchView('landing')" class="w-10 h-10 rounded-2xl bg-gradient-to-br from-rose-500 to-pink-600 text-white flex items-center justify-center shadow-md shadow-rose-500/25 hover:scale-105 transition" title="Mourise Studio Home">
        <i data-lucide="clapperboard" class="w-5 h-5"></i>
      </button>

      <nav class="flex flex-col gap-3 mt-2">
        <button onclick="switchView('landing')" id="nav-home" class="nav-btn flex flex-col items-center gap-1 p-2 rounded-xl text-slate-600 hover:text-slate-900 hover:bg-white/70 transition">
          <i data-lucide="home" class="w-4 h-4"></i>
          <span class="text-[10px] font-medium">Home</span>
        </button>
        <button onclick="switchView('landing')" id="nav-projects" class="nav-btn flex flex-col items-center gap-1 p-2 rounded-xl text-slate-600 hover:text-slate-900 hover:bg-white/70 transition">
          <i data-lucide="folder-kanban" class="w-4 h-4"></i>
          <span class="text-[10px] font-medium">Projects</span>
        </button>
        <button onclick="switchView('editor')" id="nav-editor" class="nav-btn flex flex-col items-center gap-1 p-2 rounded-xl text-blue-600 bg-white shadow-sm transition">
          <i data-lucide="file-text" class="w-4 h-4"></i>
          <span class="text-[10px] font-semibold">Script</span>
        </button>
      </nav>
    </div>

    <div class="flex flex-col items-center gap-3">
      <button onclick="exportBackupJSON()" title="Backup JSON untuk Git" class="p-2.5 rounded-xl text-slate-500 hover:text-slate-900 hover:bg-white/70 transition">
        <i data-lucide="download" class="w-4 h-4"></i>
      </button>
      <div class="text-[9px] text-slate-400 text-center leading-tight px-1">
        Mourise<br/>Studio
      </div>
    </div>
  </aside>

  <!-- MAIN CONTAINER -->
  <div class="flex-1 flex flex-col h-full overflow-hidden">

    <!-- TOP HEADER BAR (Persis StudioBinder + Liquid Glass) -->
    <header class="no-print h-13 liquid-glass px-5 py-2.5 flex items-center justify-between border
